name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build
      - run: npm pack --dry-run

      - name: Validate scaffold
        run: |
          target_dir="$(mktemp -d)/ci-app"
          node dist/cli.js ci-app --target-dir "$target_dir"
          test -d "$target_dir/.git"
          test -f "$target_dir/bun.lock"
          test -f "$target_dir/AGENTS.md"
