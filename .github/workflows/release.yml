name: Release

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: Version increment to publish
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure the working tree is clean
        run: test -z "$(git status --porcelain)"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20

      - run: bun install --frozen-lockfile
      - run: bun run template:build
      - run: git diff --exit-code
      - run: bun run check
      - run: bun run test
      - run: bun run build
      - run: bun run test:scaffold

      - name: Bump package version
        run: npm version "${{ inputs.release-type }}" --no-git-tag-version

      - name: Generate changelog entry
        run: node scripts/release.mjs

      - run: npm pack --dry-run
      - name: Publish package
        run: npm publish --access public

      - name: Commit and tag release
        run: |
          version="$(node -p "require('./package.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          git commit -m "release: v${version}"
          git tag "v${version}"
          git push origin "HEAD:${{ github.ref_name }}" --follow-tags
